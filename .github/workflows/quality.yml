name: World Monitor Quality Gate

on:
  push:
    branches: [main, ci/verify-build-and-regressions]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: world-monitor-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Run data regression tests
        run: npm run test:data
      - name: Run sidecar and API regression tests
        run: npm run test:sidecar
      - name: Build production web application
        run: npm run build
